name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install jsonschema PyYAML requests

      - name: Health check
        run: python SCRIPTS/se.py doctor

      - name: Validate contracts and coverage
        run: python SCRIPTS/se.py validate

      - name: Tests
        shell: bash
        run: |
          set +e
          python TESTS/run_tests.py 2>&1 | tee tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failures=$(grep -E "^(FAIL|ERROR):" tests.log | head -10)
            if [ -n "$failures" ]; then
              while IFS= read -r line; do echo "::error::$line"; done <<< "$failures"
              {
                echo "### Tests failed"
                echo '```'
                echo "$failures"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::test run failed without a FAIL/ERROR line; see the job log"
            fi
            # One annotation carrying the failing test's traceback tail, so the
            # reason is readable from the public check-run annotations API even
            # though GitHub hides the job log behind a login.
            detail=$(grep -A 12 -E "^(FAIL|ERROR):" tests.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Failing test detail::$detail"
          fi
          exit "$status"

      - name: Installer tests (SE-INSTALLER)
        shell: bash
        run: |
          # The installer's TUI tests import the real package, so install its
          # runtime dependencies (textual/rich/...) instead of only pytest.
          python -m pip install --quiet -e SE-INSTALLER pytest
          set +e
          PYTHONPATH=SE-INSTALLER python -m pytest SE-INSTALLER/tests -q 2>&1 | tee installer-tests.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failures=$(grep -E "^(FAILED|ERROR)" installer-tests.log | head -10)
            if [ -n "$failures" ]; then
              while IFS= read -r line; do echo "::error::$line"; done <<< "$failures"
              {
                echo "### SE-INSTALLER tests failed"
                echo '```'
                echo "$failures"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::SE-INSTALLER test run failed; see the job log"
            fi
          fi
          exit "$status"

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-log-${{ matrix.os }}
          path: |
            tests.log
            installer-tests.log
          if-no-files-found: ignore
