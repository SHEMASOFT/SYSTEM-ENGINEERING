name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install jsonschema PyYAML requests

      - name: Health check
        run: python SCRIPTS/se.py doctor

      - name: Validate contracts and coverage
        run: python SCRIPTS/se.py validate

      - name: Tests
        run: python TESTS/run_tests.py
