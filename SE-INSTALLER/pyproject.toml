[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "se-installer"
version = "0.1.0"
description = "Unified installer for System Engineering Master System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.50",
    "rich>=13.0",
    "jsonschema>=4.0",
    "requests>=2.28",
    "httpx>=0.25",
]
[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
se-installer = "se_installer.cli:main"
se-installer-tui = "se_installer.tui:InstallerApp.run"

[tool.setuptools.packages.find]
where = ["."]
include = ["se_installer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py310"