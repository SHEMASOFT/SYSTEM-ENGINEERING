[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "se-installer-web"
version = "1.0.0"
description = "SE Installer Web - FastAPI + WebSocket backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "websockets>=11.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["se_installer_web*"]

[project.scripts]
se-installer-web = "se_installer_web.main:main"