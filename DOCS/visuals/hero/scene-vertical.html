<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SYSTEM ENGINEERING — hero vertical</title>
<style>
  :root{
    --bg:#05070E;
    --ink:#E9F2FF;
    --muted:#8FA6C4;
    --cyan:#00E5FF;
    --magenta:#FF2BD6;
    --blue:#3B82F6;
    --card:rgba(11,18,34,.92);
    --line:rgba(120,160,210,.17);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg)}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink)}
  #stage{position:relative;width:1080px;height:1920px;overflow:hidden}

  .glow{position:absolute;border-radius:50%;filter:blur(120px);opacity:0}
  .glow.a{width:900px;height:900px;left:-320px;top:-380px;background:radial-gradient(circle,rgba(0,229,255,.34),transparent 64%)}
  .glow.b{width:1000px;height:1000px;right:-380px;bottom:-420px;background:radial-gradient(circle,rgba(255,43,214,.30),transparent 64%)}
  .grid{position:absolute;inset:0;opacity:0;
    background-image:linear-gradient(to right,rgba(120,170,230,.05) 1px,transparent 1px),
                     linear-gradient(to bottom,rgba(120,170,230,.05) 1px,transparent 1px);
    background-size:54px 54px;
    mask-image:radial-gradient(ellipse at 50% 34%,#000 38%,transparent 82%)}

  header{position:absolute;left:84px;right:84px;top:118px}
  .kicker{display:flex;align-items:center;gap:14px;font-size:17px;letter-spacing:6px;
    font-weight:700;color:var(--cyan);opacity:0;text-transform:uppercase}
  .kicker .bar{width:54px;height:3px;background:linear-gradient(90deg,var(--cyan),var(--magenta));border-radius:3px}
  .kicker i{font-style:normal;letter-spacing:2px;color:#7FD9EE;text-transform:none;font-size:15px}
  h1{margin-top:26px;font-size:64px;line-height:1.07;font-weight:800;letter-spacing:-1.8px;opacity:0;
    background:linear-gradient(96deg,#FFFFFF 5%,#D6ECFF 46%,#F5C9EF 94%);
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:20px;font-size:24px;line-height:1.35;color:var(--muted);opacity:0;max-width:880px}

  #rail{position:absolute;left:112px;width:3px;border-radius:3px;
    background:linear-gradient(180deg,rgba(0,229,255,.05),rgba(0,229,255,.65) 16%,rgba(255,43,214,.65) 84%,rgba(255,43,214,.05));
    transform-origin:top;transform:scaleY(0);opacity:.9}
  .dotflow{position:absolute;left:107.5px;width:12px;height:12px;border-radius:50%;
    background:#BFF4FF;box-shadow:0 0 18px 4px rgba(0,229,255,.55);opacity:0}

  .node{position:absolute;left:152px;width:844px;height:118px;padding:17px 24px;border-radius:16px;
    background:var(--card);border:1px solid var(--line);
    box-shadow:0 26px 60px -34px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.045);
    opacity:0;transform:translateY(18px)}
  .node::before{content:"";position:absolute;left:0;top:13px;bottom:13px;width:4px;border-radius:4px;background:var(--accent)}
  .node .role{font-size:13px;letter-spacing:3px;font-weight:700;color:var(--muted);text-transform:uppercase}
  .node .title{margin-top:7px;font-size:27px;font-weight:700;letter-spacing:-.4px;line-height:1.12}
  .node .state{margin-top:8px;font-size:15px;font-weight:600;color:var(--accent);display:flex;align-items:center;gap:9px}
  .node .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .chip{position:absolute;top:16px;right:20px;font-size:12px;font-weight:800;letter-spacing:1.6px;
    padding:3px 9px;border-radius:6px;color:var(--magenta);
    border:1px solid rgba(255,43,214,.55);background:rgba(255,43,214,.10)}

  #stats{position:absolute;left:84px;right:84px;top:1402px;display:flex;flex-wrap:wrap;gap:12px;opacity:0}
  .pill{display:flex;align-items:baseline;gap:10px;padding:11px 18px;border-radius:12px;
    background:rgba(12,20,36,.78);border:1px solid var(--line)}
  .pill b{font-size:23px;font-weight:800;letter-spacing:-.5px;color:#fff}
  .pill span{font-size:13px;color:var(--muted);letter-spacing:1.3px;text-transform:uppercase;font-weight:600}

  #extras{position:absolute;left:84px;right:84px;top:1508px;display:flex;gap:12px;opacity:0}
  .extra{display:flex;align-items:center;gap:9px;padding:9px 16px;border-radius:11px;
    background:rgba(12,20,36,.6);border:1px solid var(--line);font-size:17px;color:#CFE0F5}
  .extra .d{width:8px;height:8px;border-radius:50%;box-shadow:0 0 10px currentColor}
  .extra.blue{color:#7FB2FF}
  .extra.cyan{color:#5FE7F7}
  .extra .t{color:#CFE0F5}
  .extra .n{font-size:11px;font-weight:800;letter-spacing:1.4px;padding:2px 7px;border-radius:5px;
    color:var(--magenta);border:1px solid rgba(255,43,214,.5);background:rgba(255,43,214,.1)}

  footer{position:absolute;left:84px;right:84px;top:1598px;opacity:0}
  .cmd{display:flex;align-items:center;gap:14px;font-family:"Cascadia Code",Consolas,monospace;font-size:23px}
  .cmd .shell{color:var(--magenta)}
  .cmd .text{color:#D8E6F8}
  .cmd .ok{color:var(--cyan);font-weight:700;letter-spacing:1px}
  .url{margin-top:14px;font-size:19px;color:var(--muted);letter-spacing:.4px}
  .url b{color:#CFE9FF;font-weight:600}
</style>
</head>
<body>
<div id="stage">
  <div class="glow a" id="glowA"></div>
  <div class="glow b" id="glowB"></div>
  <div class="grid" id="grid"></div>

  <header>
    <div class="kicker" id="kicker"><span class="bar"></span>System Engineering <i>· v0.12.0</i></div>
    <h1 id="title">A governed runtime for AI coding agents</h1>
    <div class="sub" id="sub">Lifecycle, gates, roles and memory — evidence instead of claims.</div>
  </header>

  <div id="rail"></div>
  <div id="stage-nodes"></div>

  <div id="stats">
    <div class="pill"><b>27</b><span>commands</span></div>
    <div class="pill"><b>12</b><span>agents</span></div>
    <div class="pill"><b>7</b><span>skills</span></div>
    <div class="pill"><b>G0–G8</b><span>gates</span></div>
  </div>

  <div id="extras">
    <div class="extra blue"><span class="d" style="background:currentColor"></span><span class="t">Memory by project</span></div>
    <div class="extra cyan"><span class="d" style="background:currentColor"></span><span class="t">Trace</span><span class="n">NEW</span></div>
  </div>

  <footer id="footer">
    <div class="cmd"><span class="shell">$</span><span class="text">se doctor</span><span class="ok">PASS</span></div>
    <div class="url">github.com/<b>SHEMASOFT/SYSTEM-ENGINEERING</b></div>
  </footer>
</div>

<script>
const T = 8.0;
const Y0 = 520, H = 118, GAP = 28;

const NODES = [
  {id:'task',  role:'Intake',     title:'Task input',              state:'implemented', color:'#22D3EE', at:1.55},
  {id:'orch',  role:'Engine',     title:'Orchestrator',            state:'implemented', color:'#22D3EE', at:1.95},
  {id:'route', role:'Dispatch',   title:'Native / internal route', state:'implemented', color:'#22D3EE', at:2.35},
  {id:'model', role:'Runtime',    title:'LLM provider',            state:'on config',   color:'#3B82F6', at:2.75},
  {id:'gates', role:'Validation', title:'Gates G0–G8',             state:'implemented', color:'#22D3EE', at:3.15},
  {id:'ckpt',  role:'State',      title:'Checkpoint CP-NNNN',      state:'implemented', color:'#22D3EE', at:3.55},
];

const nodesEl = document.getElementById('stage-nodes');
const els = {};
NODES.forEach((n, i) => {
  const el = document.createElement('div');
  el.className = 'node';
  el.style.top = (Y0 + i * (H + GAP)) + 'px';
  el.style.setProperty('--accent', n.color);
  el.innerHTML = `<div class="role">${n.role}</div>
    <div class="title">${n.title}</div>
    <div class="state"><span class="dot"></span>${n.state}</div>`;
  nodesEl.appendChild(el);
  els[n.id] = el;
});

const dot = document.createElement('div');
dot.className = 'dotflow';
document.getElementById('stage').appendChild(dot);

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const easeOut = t => 1 - Math.pow(1 - clamp(t), 3);
const fade = (t, start, dur) => clamp((t - start) / dur);

const RAIL_TOP = Y0 - 10;
const RAIL_BOTTOM = Y0 + (NODES.length - 1) * (H + GAP) + H * 0.55;
const RAIL_LEN = RAIL_BOTTOM - RAIL_TOP;

window.__render = function (t) {
  t = ((t % T) + T) % T;

  const bg = easeOut(fade(t, 0, 0.8));
  document.getElementById('glowA').style.opacity = (0.95 * bg).toFixed(3);
  document.getElementById('glowB').style.opacity = (0.95 * bg).toFixed(3);
  document.getElementById('grid').style.opacity = (0.95 * bg).toFixed(3);

  const k = easeOut(fade(t, 0.25, 0.5));
  const ki = document.getElementById('kicker');
  ki.style.opacity = k.toFixed(3);
  ki.style.transform = `translateY(${(1 - k) * 12}px)`;

  const ti = easeOut(fade(t, 0.40, 0.75));
  const title = document.getElementById('title');
  title.style.opacity = ti.toFixed(3);
  title.style.transform = `translateY(${(1 - ti) * 26}px)`;

  const si = easeOut(fade(t, 0.80, 0.65));
  document.getElementById('sub').style.opacity = si.toFixed(3);
  document.getElementById('sub').style.transform = `translateY(${(1 - si) * 14}px)`;

  const rail = document.getElementById('rail');
  const rp = easeOut(fade(t, 1.30, 2.9));
  rail.style.top = RAIL_TOP + 'px';
  rail.style.height = RAIL_LEN + 'px';
  rail.style.transform = `scaleY(${rp.toFixed(3)})`;

  NODES.forEach(n => {
    const p = easeOut(fade(t, n.at, 0.5));
    const el = els[n.id];
    el.style.opacity = p.toFixed(3);
    el.style.transform = `translateY(${(1 - p) * 20}px)`;
  });

  const appear = fade(t, 1.6, 0.4);
  if (appear > 0) {
    const pos = ((t * 0.13) % 1);
    dot.style.top = (RAIL_TOP + pos * RAIL_LEN) + 'px';
    dot.style.opacity = (0.9 * appear).toFixed(3);
  } else {
    dot.style.opacity = '0';
  }

  const st = easeOut(fade(t, 4.55, 0.55));
  const stats = document.getElementById('stats');
  stats.style.opacity = st.toFixed(3);
  stats.style.transform = `translateY(${(1 - st) * 16}px)`;

  const ex = easeOut(fade(t, 4.95, 0.55));
  const extras = document.getElementById('extras');
  extras.style.opacity = ex.toFixed(3);
  extras.style.transform = `translateY(${(1 - ex) * 14}px)`;

  const fo = easeOut(fade(t, 5.45, 0.55));
  const footer = document.getElementById('footer');
  footer.style.opacity = fo.toFixed(3);
  footer.style.transform = `translateY(${(1 - fo) * 14}px)`;

  const out = 1 - clamp((t - 7.40) / 0.55);
  document.getElementById('stage').style.opacity = out.toFixed(3);
};

window.__render(0);
</script>
</body>
</html>
