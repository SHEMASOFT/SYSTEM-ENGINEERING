<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 460" width="700" height="460" role="img" aria-label="Pantallas de SE-CONSOLE">
  <title>Pantallas de SE-CONSOLE</title>
  <desc>Las tres pestañas de la consola: Resumen, Proyectos y Atención.</desc>
  <defs>
    <style>
      .screen { fill:#FFFFFF; stroke:#F095C8; stroke-width:2; rx:8; }
      .screen-title { font-family:sans-serif; font-size:13; font-weight:bold; fill:#1A1218; }
      .screen-sub { font-family:sans-serif; font-size:11; fill:#666666; }
      .badge { fill:#F095C8; rx:6; }
      .badge-text { font-family:sans-serif; font-size:10; font-weight:bold; fill:#FFFFFF; }
      .connector { fill:none; stroke:#D8DEE6; stroke-width:2; stroke-dasharray:4 4; }
    </style>
  </defs>

  <rect width="700" height="460" fill="#FCF3F8"/>

  <text x="350" y="30" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1A1218" text-anchor="middle">Lo que ves en SE-CONSOLE</text>

  <!-- Pantalla 1: Resumen -->
  <g transform="translate(40, 70)">
    <rect class="screen" width="190" height="340"/>
    <text x="95" y="35" class="screen-title" text-anchor="middle">1 · Resumen</text>
    <text x="95" y="55" class="screen-sub" text-anchor="middle">Estado del sistema SE</text>
    <rect x="20" y="75" width="150" height="40" fill="#F0F0F0" rx="4"/>
    <text x="95" y="92" class="screen-text" font-family="sans-serif" font-size="12" fill="#1A1218" text-anchor="middle" font-weight="bold">HEALTHY</text>
    <text x="95" y="110" class="screen-sub" text-anchor="middle">21 PASS · 0 WARN · 0 FAIL</text>
    <text x="30" y="140" class="screen-text" font-family="sans-serif" font-size="11" fill="#333">• Identidad del sistema</text>
    <text x="30" y="158" class="screen-text" font-family="sans-serif" font-size="11" fill="#333">• Salud (se doctor)</text>
    <text x="30" y="176" class="screen-text" font-family="sans-serif" font-size="11" fill="#333">• Capacidades del motor</text>
    <text x="30" y="194" class="screen-text" font-family="sans-serif" font-size="11" fill="#333">• Agentes y skills</text>
    <text x="30" y="212" class="screen-text" font-family="sans-serif" font-size="11" fill="#333">• Ciclo de vida y gates</text>
    <text x="95" y="245" class="screen-sub" text-anchor="middle">Solo lectura. Nada se inventa.</text>
  </g>

  <!-- Pantalla 2: Proyectos -->
  <g transform="translate(260, 70)">
    <rect class="screen" width="190" height="340"/>
    <text x="95" y="35" class="screen-title" text-anchor="middle">2 · Proyectos</text>
    <text x="95" y="55" class="screen-sub" text-anchor="middle">Tarjetas con ciclo de vida</text>
    <rect x="20" y="75" width="150" height="200" fill="#F0F0F0" rx="4"/>
    <text x="30" y="95" class="screen-text" font-family="sans-serif" font-size="11" fill="#333">MiApp · PLANNING</text>
    <text x="30" y="112" class="screen-text" font-family="sans-serif" font-size="10" fill="#666">G2 FAIL → no puede avanzar</text>
    <text x="30" y="138" class="screen-text" font-family="sans-serif" font-size="11" fill="#333">SHEMA · DISCOVERY</text>
    <text x="30" y="155" class="screen-text" font-family="sans-serif" font-size="10" fill="#666">G1 FAIL → pendiente</text>
    <text x="30" y="181" class="screen-text" font-family="sans-serif" font-size="11" fill="#333">SHEMASEG · ACTIVE</text>
    <text x="30" y="198" class="screen-text" font-family="sans-serif" font-size="10" fill="#666">G4 PASS → listo</text>
    <text x="95" y="230" class="screen-text" font-family="sans-serif" font-size="11" fill="#333" text-anchor="middle" font-weight="bold">Haz clic → detalle + memoria</text>
    <rect x="20" y="250" width="150" height="70" fill="#FFF5FA" rx="4" stroke="#F095C8" stroke-width="1"/>
    <text x="30" y="268" class="screen-text" font-family="sans-serif" font-size="11" fill="#1A1218">MEMORIA AUTOMÁTICA</text>
    <text x="30" y="284" class="screen-text" font-family="sans-serif" font-size="10" fill="#666">Foco · próximos pasos · notas · contexto</text>
    <text x="30" y="300" class="screen-text" font-family="sans-serif" font-size="10" fill="#666">(se genera sola, no escribes nada)</text>
  </g>

  <!-- Pantalla 3: Atención -->
  <g transform="translate(480, 70)">
    <rect class="screen" width="190" height="340"/>
    <text x="95" y="35" class="screen-title" text-anchor="middle">3 · Atención</text>
    <text x="95" y="55" class="screen-sub" text-anchor="middle">Qué necesita tu acción</text>
    <rect x="20" y="75" width="150" height="120" fill="#F0F0F0" rx="4"/>
    <text x="30" y="95" class="screen-text" font-family="sans-serif" font-size="11" fill="#333">64 BLOCKED · 36 WARNING</text>
    <text x="30" y="112" class="screen-text" font-family="sans-serif" font-size="10" fill="#666">Orden de prioridad, no veredicto</text>
    <rect x="20" y="200" width="150" height="110" fill="#FFF5FA" rx="4" stroke="#F095C8" stroke-width="1"/>
    <text x="30" y="218" class="screen-text" font-family="sans-serif" font-size="11" fill="#1A1218">DRAWER DE PASOS</text>
    <text x="30" y="234" class="screen-text" font-family="sans-serif" font-size="10" fill="#666">Haz clic en una fila →</text>
    <text x="30" y="250" class="screen-text" font-family="sans-serif" font-size="10" fill="#666">pasos a seguir, a qué pertenece,</text>
    <text x="30" y="266" class="screen-text" font-family="sans-serif" font-size="10" fill="#666">acciones disponibles</text>
  </g>

  <!-- Conectores -->
  <line x1="230" y1="240" x2="260" y2="240" class="connector"/>
  <line x1="450" y1="240" x2="480" y2="240" class="connector"/>

  <text x="350" y="430" font-family="sans-serif" font-size="12" fill="#666666" text-anchor="middle">3 temas · magenta / azul / claro · EN / ES · sin animaciones · contraste verificado</text>
</svg>
