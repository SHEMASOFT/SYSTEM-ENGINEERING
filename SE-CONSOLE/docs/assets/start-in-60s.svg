<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420" role="img" aria-label="SE-CONSOLE en 60 segundos">
  <title>SE-CONSOLE en 60 segundos</title>
  <desc>Flujo rápido: 1 clic, 1 navegador, listo en menos de un minuto.</desc>
  <defs>
    <style>
      .step-bg { fill:#FFFFFF; stroke:#F095C8; stroke-width:2; rx:12; }
      .step-num { font-family:sans-serif; font-size:16; font-weight:bold; fill:#1A1218; }
      .step-text { font-family:sans-serif; font-size:14; fill:#333333; }
      .arrow { fill:none; stroke:#F095C8; stroke-width:3; marker-end:url(#arr); }
      .marker { fill:#F095C8; }
      .badge { fill:#F095C8; rx:8; }
      .badge-text { font-family:sans-serif; font-size:12; font-weight:bold; fill:#FFFFFF; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F095C8"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="700" height="420" fill="#FCF3F8"/>

  <!-- Título -->
  <text x="350" y="40" font-family="sans-serif" font-size="22" font-weight="bold" fill="#1A1218" text-anchor="middle">SE-CONSOLE en 60 segundos</text>
  <text x="350" y="62" font-family="sans-serif" font-size="14" fill="#666666" text-anchor="middle">Desde que haces doble clic hasta que ves tus proyectos</text>

  <!-- Paso 1 -->
  <g transform="translate(50, 100)">
    <rect class="step-bg" width="160" height="120"/>
    <circle cx="24" cy="30" r="24" class="badge"/>
    <text x="24" y="35" class="badge-text" text-anchor="middle">1</text>
    <text x="80" y="62" class="step-text" text-anchor="middle">Doble clic</text>
    <text x="80" y="82" class="step-text" text-anchor="middle">Start SE Console.cmd</text>
    <text x="80" y="102" class="step-text" text-anchor="middle" fill="#F095C8" font-weight="bold">→ servidor arriba</text>
    <text x="80" y="135" class="step-text" text-anchor="middle" font-size="12" fill="#888888">(o: python -m console.server)</text>
  </g>

  <!-- Flecha 1→2 -->
  <line x1="230" y1="160" x2="290" y2="160" class="arrow"/>

  <!-- Paso 2 -->
  <g transform="translate(310, 100)">
    <rect class="step-bg" width="160" height="120"/>
    <circle cx="24" cy="30" r="24" class="badge"/>
    <text x="24" y="35" class="badge-text" text-anchor="middle">2</text>
    <text x="80" y="62" class="step-text" text-anchor="middle">Abre el navegador</text>
    <text x="80" y="82" class="step-text" text-anchor="middle">http://localhost:8777</text>
    <text x="80" y="102" class="step-text" text-anchor="middle" fill="#F095C8" font-weight="bold">→ consola cargada</text>
  </g>

  <!-- Flecha 2→3 -->
  <line x1="490" y1="160" x2="550" y2="160" class="arrow"/>

  <!-- Paso 3 -->
  <g transform="translate(570, 100)">
    <rect class="step-bg" width="160" height="120"/>
    <circle cx="24" cy="30" r="24" class="badge"/>
    <text x="24" y="35" class="badge-text" text-anchor="middle">3</text>
    <text x="80" y="62" class="step-text" text-anchor="middle">Haz clic en</text>
    <text x="80" y="82" class="step-text" text-anchor="middle">Proyectos</text>
    <text x="80" y="102" class="step-text" text-anchor="middle" fill="#F095C8" font-weight="bold">→ ves tus 5 proyectos</text>
    <text x="80" y="135" class="step-text" text-anchor="middle" font-size="12" fill="#888888">incluyendo MiApp, SHEMA, SHEMASEG</text>
  </g>

  <!-- Línea de tiempo inferior -->
  <line x1="50" y1="300" x2="650" y2="300" stroke="#D8DEE6" stroke-width="2"/>
  <text x="50" y="285" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1A1218">Tiempo total:</text>
  <text x="150" y="285" font-family="sans-serif" font-size="18" font-weight="bold" fill="#F095C8" text-anchor="start">&lt; 60 segundos</text>
  <text x="50" y="330" font-family="sans-serif" font-size="13" fill="#666666" text-anchor="start">Sin instalación, sin Node, sin build. Solo Python y tu navegador.</text>
  <text x="50" y="350" font-family="sans-serif" font-size="13" fill="#666666" text-anchor="start">Solo lectura: no toca ni modifica tu SYSTEM-ENGINEERING.</text>
</svg>
